name: Atualizar resultados
on:
  schedule:
    - cron: "0 * * * *"   # de hora em hora, para pegar os sorteios que saem durante o dia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/atualizar.py
      - name: Gravar mudanças
        run: |
          git config user.name "atualizador"
          git config user.email "actions@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "Atualiza resultados" && git push)
